name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build release package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $notes = Get-Content -Raw -Path RELEASE_NOTES.md
          ./build-release.ps1 -GitHubRepo "zoubidou31/mohasabi" -Version $version -ReleaseNotes $notes

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag `
            "dist/release/Mohasabi_setup.exe" `
            "dist/release/Mohasabi_README.txt" `
            "release/update-source/version.json" `
            --repo "zoubidou31/mohasabi" `
            --title "Mohasabi $tag" `
            --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
